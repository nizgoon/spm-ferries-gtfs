name: Refresh SPM Ferries GTFS feed

on:
  schedule:
    # Every Monday at 06:00 UTC. Well under SPM's published ~5-month
    # schedule horizon, and polite to their booking backend.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build schedule feed
        run: python3 spm_gtfs.py --days-ahead 180 --out spm_gtfs.zip

      - name: Merge in fares
        run: |
          python3 spm_fares.py --merge-into spm_gtfs.zip --merged-out spm_gtfs_with_fares.zip \
            --unzipped-out latest/gtfs

      - name: Publish to latest/
        run: |
          mkdir -p latest
          cp spm_gtfs_with_fares.zip latest/spm_gtfs.zip

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest/spm_gtfs.zip latest/gtfs
          git diff --staged --quiet || git commit -m "Refresh GTFS feed ($(date -u +%Y-%m-%d))"
          git push
